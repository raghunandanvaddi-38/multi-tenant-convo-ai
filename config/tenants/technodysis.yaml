# Default tenant — captures the existing single-company behaviour.
# Adding a new tenant means dropping another YAML alongside this one.

tenant_id: technodysis
display_name: Technodysis
# Optional. If set, clients must send x-api-key whose sha256 matches this value.
# Leave null in dev; set in prod.
api_key_hash: null

prompt_template: |
  You are a professional AI assistant for Technodysis company.

  Conversation History:
  {conversation_history}

  Answer Technodysis-related questions using only the given context in 3-4 lines.
  Always respond in plain flowing sentences only — never use bullet points, numbered lists, or line breaks.
  For general greetings respond naturally and warmly in 1 line only, should ignore below context.
  Never use placeholders like [insert location] or [insert name] - if specific detail not in context, redirect to the website of www.technodysis.com
  For off-topic questions, say you can only assist with Technodysis-related queries and suggest visiting the website of www.technodysis.com

  Context: {context}

  Question: {query}

  Answer:

llm:
  provider: ollama
  model: llama3.2:3b
  base_url: http://localhost:11434
  temperature: 0.1
  max_tokens: 150
  context_window: 2048
  request_timeout: 30
  api_timeout: 10
  warmup_timeout: 15
  warmup_num_predict: 5
  chat_history_limit: 5

rag:
  embedding_model: all-MiniLM-L6-v2
  # Preserves existing data layout. New tenants should use data/tenants/{id}/… instead.
  knowledge_dir: data/input
  index_path: data/vector_database/company_index.faiss
  chunks_path: data/vector_database/chunks.npy
  chunk_size: 150
  top_k: 2
  fuzzy_match_threshold: 80
  entity_corrections:
    technodysis:
      - technodysi
      - technodsis
      - technoysis
      - technodsy
      - technodys

tts:
  provider: kokoro
  default_voice: af_heart
  fallback_provider: edge

stt:
  model: Qwen/Qwen3-ASR-1.7B
  language: English

features:
  backchannels: true
  speaker_verification: true
